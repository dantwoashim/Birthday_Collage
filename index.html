<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0e0a17">
    <title>Happy Birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=Parisienne&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="scene-backdrop" aria-hidden="true">
        <div class="backdrop-gradient"></div>
        <div class="backdrop-grid"></div>
        <div class="backdrop-rings"></div>
        <div class="backdrop-grain"></div>
        <div class="backdrop-orb orb-a"></div>
        <div class="backdrop-orb orb-b"></div>
        <div class="backdrop-orb orb-c"></div>
    </div>

    <div id="introOverlay" class="intro-overlay" aria-hidden="false">
        <div class="intro-panel">
            <h1 id="introTitle" class="intro-title"></h1>
            <p class="intro-copy">A little collage of your favorite moments.</p>
            <button id="introSkip" class="intro-skip" type="button">Step inside</button>
        </div>
    </div>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
        <button id="lightboxClose" class="lightbox-close" type="button" aria-label="Close memory view">Close</button>
        <div class="lightbox-panel">
            <img id="lightboxImg" src="" alt="Expanded birthday memory">
        </div>
    </div>

    <main class="scene-shell">
        <section class="stage" id="stage">
            <div class="stage-wash" aria-hidden="true"></div>
            <div class="stage-rim" aria-hidden="true"></div>
            <div class="stage-noise" aria-hidden="true"></div>
            <div class="stage-orbit stage-orbit-a" aria-hidden="true"></div>
            <div class="stage-orbit stage-orbit-b" aria-hidden="true"></div>

            <article class="hero-panel" id="heroPanel">
                <div class="hero-float">
                    <h1 class="hero-title">
                        <span>Happy</span>
                        <span>Birthday</span>
                    </h1>
                    <p class="hero-copy">Wishing you a day as beautiful as these memories.</p>
                </div>
            </article>

            <div class="memory-grid" id="collageWrapper" aria-label="Birthday memory collage"></div>

            <button id="fullscreenBtn" class="fullscreen-btn" type="button" aria-label="Toggle fullscreen">
                <svg id="fsIconExpand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 3H5a2 2 0 0 0-2 2v4"></path>
                    <path d="M15 3h4a2 2 0 0 1 2 2v4"></path>
                    <path d="M21 15v4a2 2 0 0 1-2 2h-4"></path>
                    <path d="M3 15v4a2 2 0 0 0 2 2h4"></path>
                </svg>
            </button>
        </section>
    </main>

    <script src="main.js"></script>
</body>

</html>
