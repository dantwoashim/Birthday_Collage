<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07080b">
    <title>Happy Birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Parisienne&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="scene-backdrop" aria-hidden="true">
        <div class="backdrop-gradient"></div>
        <div class="backdrop-grid"></div>
        <div class="backdrop-rings"></div>
        <div class="backdrop-grain"></div>
        <div class="backdrop-orb orb-a"></div>
        <div class="backdrop-orb orb-b"></div>
        <div class="backdrop-orb orb-c"></div>
    </div>

    <div id="introOverlay" class="intro-overlay" aria-hidden="false">
        <div class="intro-panel">
            <p id="introTitle" class="intro-title"></p>
            <button id="introSkip" class="intro-skip" type="button">Open</button>
        </div>
    </div>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
        <button id="lightboxClose" class="lightbox-close" type="button" aria-label="Close memory view">Close</button>
        <div class="lightbox-panel">
            <img id="lightboxImg" src="" alt="Expanded birthday memory">
        </div>
    </div>

    <main class="scene-shell">
        <section class="stage" id="stage">
            <div class="stage-wash" aria-hidden="true"></div>
            <div class="stage-aurora" aria-hidden="true"></div>
            <div class="stage-grid" aria-hidden="true"></div>
            <div class="stage-lines" aria-hidden="true"></div>
            <div class="stage-vignette" aria-hidden="true"></div>
            <div class="stage-noise" aria-hidden="true"></div>
            <div class="stage-rim" aria-hidden="true"></div>
            <div class="stage-ring stage-ring-a" aria-hidden="true"></div>
            <div class="stage-ring stage-ring-b" aria-hidden="true"></div>
            <div class="stage-bloom bloom-a" aria-hidden="true"></div>
            <div class="stage-bloom bloom-b" aria-hidden="true"></div>
            <div class="particle-layer particle-layer-back" id="particleLayerBack" aria-hidden="true"></div>
            <div class="particle-layer particle-layer-mid" id="particleLayerMid" aria-hidden="true"></div>
            <div class="particle-layer particle-layer-front" id="particleLayerFront" aria-hidden="true"></div>
            <div class="glint-layer" id="glintLayer" aria-hidden="true"></div>

            <article class="wish-panel" aria-label="Birthday wish">
                <p class="wish-script"></p>
                <h1 class="wish-title">
                    <span>Happy</span>
                    <span>Birthday</span>
                </h1>
                <p class="wish-copy">May your heart always remain light, your smile always sincere, and your path always lead you toward places, people and possibilities that feel meant for you</p>
            </article>

            <p id="fullscreenHint" class="fullscreen-hint" aria-live="polite"><kbd>F</kbd> fullscreen / <kbd>Esc</kbd> exit</p>

            <div class="memory-grid" id="collageWrapper" aria-label="Birthday memory collage"></div>
        </section>
    </main>

    <script src="main.js"></script>
</body>

</html>
